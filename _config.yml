title: Alex 的学习手记
subtitle: 机器人 · 控制 · 嵌入式
description: 记录问题、理解与实践。
author: Alex
language: zh-CN
timezone: Asia/Shanghai
url: https://alex10086.github.io
root: /
permalink: posts/:title/
permalink_defaults: {}
source_dir: source
public_dir: dist
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
- vendor/**
- audio/**
- custom.js
- custom.css
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: []
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: false
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
index_generator:
  path: ''
  per_page: 10
  order_by: -date
default_category: 随记
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: date
per_page: 10
pagination_dir: page
theme: redefine
search:
  path: search.json
  field: post
  content: true
  format: html
feed:
  type: atom
  path: atom.xml
  limit: 20
markdown:
  render:
    html: true
    breaks: false
    linkify: true
    typographer: true
  plugins:
  - name: markdown-it-katex
