info:
  title: Alex 的学习手记
  subtitle: 机器人 · 控制 · 嵌入式
  author: Alex
  url: https://alex10086.github.io
defaults:
  favicon: /images/avatar.svg
  logo: /images/avatar.svg
  avatar: /images/avatar.svg
colors:
  primary: '#1f5da3'
  secondary: '#e600b8'
  default_mode: light
global:
  fonts:
    chinese:
      enable: false
      family: null
      url: null
    english:
      enable: false
      family: null
      url: null
    title:
      enable: false
      family: null
      url: null
  content_max_width: 1080px
  sidebar_width: 210px
  hover:
    shadow: true
    scale: true
  scroll_progress:
    bar: false
    percentage: true
  website_counter:
    url: https://cn.vercount.one/js
    enable: true
    site_pv: true
    site_uv: true
    post_pv: true
  single_page: true
  preloader:
    enable: true
    custom_message: null
  side_tools:
    gear_rotation: true
    auto_expand: false
  open_graph:
    enable: true
    image: /images/banner.svg
    description: 记录机器人、控制与嵌入式学习。
  google_analytics:
    enable: false
    id: null
fontawesome:
  thin: false
  light: false
  duotone: false
  sharp_solid: false
home_banner:
  enable: true
  style: fixed
  image:
    light: /images/wallhaven-wqery6-light.webp
    dark: /images/wallhaven-wqery6-dark.webp
  title: 欢迎。
  subtitle:
    text:
    - 把不懂的东西，慢慢弄懂。
    - 记录机器人、控制与嵌入式学习。
    hitokoto:
      enable: false
      show_author: false
      api: https://v1.hitokoto.cn
    typing_speed: 100
    backing_speed: 80
    starting_delay: 500
    backing_delay: 3000
    loop: true
    smart_backspace: true
  text_color:
    light: '#fff'
    dark: '#d1d1b6'
  text_style:
    title_size: 2.8rem
    subtitle_size: 1.5rem
    line_height: 1.2
  custom_font:
    enable: false
    family: null
    url: null
  social_links:
    enable: true
    style: default
    links:
    - icon: github
      url: https://github.com/Alex10086
    qrs: []
navbar:
  auto_hide: false
  color:
    left: '#CE6E59'
    right: '#ffffff'
    transparency: 50
  width:
    home: 1200px
    pages: 1000px
  links:
    Home:
      path: /
      icon: fa-solid fa-house
    文章:
      icon: fa-solid fa-box-archive
      submenus:
        归档: /archives/
        标签: /tags/
        分类: /categories/
    相册:
      path: /album/
      icon: fa-solid fa-camera-retro
    实验室:
      path: /lab/
      icon: fa-solid fa-flask
    Links:
      path: /links/
      icon: fa-solid fa-link
    About:
      path: /about/
      icon: fa-solid fa-user
  search:
    enable: true
    preload: true
home:
  sidebar:
    enable: true
    position: left
    first_item: menu
    announcement: 记录问题、理解与实践。
    show_on_mobile: true
    links:
      Archives:
        path: /archives/
        icon: fa-solid fa-box-archive
      Tags:
        path: /tags/
        icon: fa-solid fa-tags
      Categories:
        path: /categories/
        icon: fa-solid fa-folder
  article_date_format: auto
  excerpt_length: 200
  categories:
    enable: true
    limit: 3
  tags:
    enable: true
    limit: 3
articles:
  style:
    font_size: 16px
    line_height: 1.5
    image_border_radius: 14px
    image_alignment: center
    image_caption: false
    link_icon: true
    delete_mask: false
    title_alignment: left
    headings_top_spacing:
      h1: 3.2rem
      h2: 2.4rem
      h3: 1.9rem
      h4: 1.6rem
      h5: 1.4rem
      h6: 1.3rem
  word_count:
    enable: true
    count: true
    min2read: true
  author_label:
    enable: true
    auto: false
    list:
    - 学习中
  code_block:
    copy: true
    style: mac
    highlight_theme:
      light: github
      dark: vs2015
    font:
      enable: false
      family: null
      url: null
  toc:
    enable: true
    max_depth: 3
    number: false
    expand: true
    init_open: true
  copyright:
    enable: false
    default: cc_by_nc_sa
  lazyload: true
  pangu_js: false
  recommendation:
    enable: false
    title: 推荐阅读
    limit: 3
    mobile_limit: 2
    placeholder: /images/wallhaven-wqery6-light.webp
    skip_dirs: []
comment:
  enable: false
  system: waline
  config:
    waline:
      serverUrl: https://example.example.com
      lang: zh-CN
      emoji: []
      recaptchaV3Key: null
      turnstileKey: null
      reaction: false
    gitalk:
      clientID: null
      clientSecret: null
      repo: null
      owner: null
      proxy: null
    twikoo:
      version: 1.6.10
      server_url: null
      region: null
    giscus:
      repo: null
      repo_id: null
      category: null
      category_id: null
      mapping: pathname
      strict: 0
      reactions_enabled: 1
      emit_metadata: 0
      lang: en
      input_position: bottom
      loading: lazy
    artalk:
      server: null
      site: null
    utterances:
      repo: null
      issue_term: pathname
      issue_number: null
      label: null
      theme_light: github-light
      theme_dark: github-dark
footer:
  runtime: true
  icon: '<i class="fa-solid fa-heart fa-beat" style="--fa-animation-duration: 0.5s;
    color: #f54545"></i>'
  start: 2026/10/09 10:47:32
  statistics: true
  customize: null
  icp:
    enable: false
    number: null
    url: null
inject:
  enable: true
  head:
  - <link rel="stylesheet" href="/vendor/sakana/sakana.min.css"><link rel="stylesheet"
    href="/custom.css"><link rel="stylesheet" href="/vendor/katex/katex.min.css">
  footer:
  - <script src="/vendor/sakana/sakana.min.js"></script><script src="/custom.js"></script>
plugins:
  feed:
    enable: true
  aplayer:
    enable: true
    type: fixed
    audios:
    - name: 午后 · 播放器演示
      artist: 原创合成音色
      url: /audio/afternoon.mp3
      cover: /images/banner.svg
      lrc: ''
  mermaid:
    enable: false
    version: 11.4.1
    theme:
      light: default
      dark: dark
page_templates:
  friends_column: 3
  tags_style: blur
  masonry:
    batch_size: 12
    initial_batch_size: 24
cdn:
  enable: false
  provider: npmmirror
  custom_url: null
developer:
  enable: false
